<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Welcome to Job Portal</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #4F46E5; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; background-color: #f9f9f9; }
        .footer { background-color: #333; color: white; padding: 10px; text-align: center; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to Job Portal</h1>
        </div>
        <div class="content">
            <h2>Hello {{ fullname }},</h2>
            <p>Your account has been created successfully.</p>
            <p>You are registered as a <strong>{{ role }}</strong> user.</p>
            <p>You can now sign in and continue with your hiring journey on the platform.</p>
            <p>Best regards,<br>Job Portal Team</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 Job Portal. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
